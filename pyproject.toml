[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figureflow-demo"
version = "0.1.0"
description = "A hybrid AI and deterministic pipeline for editable technical workflow figures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Hao Pengjin" },
]
dependencies = [
  "openai>=2.14.0,<3",
  "gradio>=6.2.0,<7",
  "pydantic>=2.12.0,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "fonttools>=4.50,<5",
  "Pillow>=11.0,<13",
  "CairoSVG>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["demo_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
