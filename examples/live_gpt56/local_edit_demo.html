<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FigureFlow 局部替换证明</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1280px; height: 720px; overflow: hidden; color: #142b4a;
      background: linear-gradient(145deg, #f8fbfe, #eef4fa); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { height: 105px; padding: 22px 36px; color: white;
      background: linear-gradient(120deg, #102944, #174d72 62%, #16827a); }
    h1 { margin: 0 0 7px; font-size: 31px; }
    header p { margin: 0; font-size: 17px; opacity: .9; }
    main { padding: 20px 28px 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel { position: relative; padding: 12px; border: 1px solid #d7e4f0; border-radius: 18px;
      background: white; box-shadow: 0 10px 28px rgba(28, 65, 101, .10); }
    .panel img { display: block; width: 100%; height: 334px; object-fit: contain; border-radius: 10px; background: #f6f8fc; }
    .label { position: absolute; left: 25px; top: 24px; padding: 7px 13px; border-radius: 99px;
      color: white; background: #2a6fbb; font-weight: 700; font-size: 15px; }
    .after .label { background: #7a5195; }
    .proof { margin-top: 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      gap: 15px; padding: 15px 20px; border-radius: 16px; border: 1px solid #d7e4f0; background: white; }
    .code { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 16px; line-height: 1.55; }
    .minus { color: #647180; }
    .plus { color: #7a5195; font-weight: 700; }
    .arrow { font-size: 35px; color: #16827a; font-weight: 800; }
    .result { text-align: right; font-size: 17px; line-height: 1.55; }
    .result strong { color: #16827a; }
  </style>
</head>
<body>
  <header>
    <h1>局部替换证明：只改 FigurePlan 第 4 个节点</h1>
    <p>复用原始 Icon、连接线与确定性布局；其余四个节点无需重新生成。</p>
  </header>
  <main>
    <section class="grid">
      <div class="panel before"><span class="label">修改前</span><img src="figureflow_live.png" alt="原始 FigureFlow 图" /></div>
      <div class="panel after"><span class="label">修改后</span><img src="figureflow_local_edit.png" alt="局部替换后的 FigureFlow 图" /></div>
    </section>
    <section class="proof">
      <div class="code">
        <div class="minus">− title: 矢量排版</div>
        <div class="plus">+ title: 局部替换</div>
      </div>
      <div class="arrow">→</div>
      <div class="result"><strong>第 4 节点文字已替换</strong><br />节点 1、2、3、5 的语义、图标与顺序保持不变</div>
    </section>
  </main>
</body>
</html>
