title: "Capability gains survive the systems audit"
evidence_status: "synthetic-demo"
subtitle: "A normalized capability view is paired with strong-scaling evidence; both panels preserve redundant encodings."
status: "SYNTHETIC DEMO - NOT MEASURED"
status_kind: "synthetic-demo"
footer: "Synthetic-demo values only - direct YAML arrays - prediction bands are illustrative"
output_name: "advanced_audit"
figsize: [8.4, 4.0]
radar:
